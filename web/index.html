<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>triple pendulum</title>
    <meta name="theme-color" content="#fbfbfa" />
    <script>
      try {
        var q = new URLSearchParams(location.search).get("theme");
        var dark = q === "dark" || (q !== "light" && localStorage.getItem("theme") === "dark");
        document.documentElement.classList.toggle("is-dark", dark);
      } catch {}
    </script>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="page">
      <div class="start" id="start">click to start</div>
      <header class="nav">
        <div class="nav-inner">
          <button type="button" class="text-btn brand" id="plant-toggle">triple pendulum</button>
          <nav class="goals" id="goals" role="group" aria-label="Desired equilibrium"></nav>
          <div class="meta">
            <button type="button" id="policy-toggle" class="text-btn">policy off</button>
            <span class="dot" aria-hidden="true">·</span>
            <span id="status" class="is-alert">loading</span>
            <button type="button" class="theme-toggle" id="theme-toggle" aria-pressed="false" aria-label="dark mode">#</button>
          </div>
        </div>
      </header>
      <main class="stage-wrap">
        <canvas id="stage"></canvas>
      </main>
      <footer class="bar">
        <div class="bar-inner">
          <div id="readout"></div>
          <div class="hint"></div>
        </div>
      </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
