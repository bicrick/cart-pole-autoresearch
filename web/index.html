<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>double pendulum</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="page">
      <div class="start" id="start">click to start</div>
      <header class="nav">
        <div class="nav-inner">
          <button type="button" class="text-btn brand" id="plant-toggle">double pendulum</button>
          <nav class="goals" id="goals" role="group" aria-label="Desired equilibrium"></nav>
          <div class="meta">
            <button type="button" id="policy-toggle" class="text-btn">policy off</button>
            <span class="dot" aria-hidden="true">·</span>
            <span id="status">loading</span>
          </div>
        </div>
      </header>
      <main class="stage-wrap">
        <canvas id="stage"></canvas>
      </main>
      <footer class="bar">
        <div class="bar-inner">
          <div id="readout">x +0.00  ·  θ1 +0.00  ·  θ2 +0.00</div>
          <div class="hint">grab the cart or either pole · 1–4 goal · tab cycle · p policy · a/d shove</div>
        </div>
      </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
